# Config del proxy Apache 2.4.49 para la demo ReVital.
# Dos cosas a la vez:
#   a) Reverse proxy: casi todo el trafico va a Drupal 7.57.
#   b) Dejar explotable CVE-2021-41773 en /icons/ (lectura) y /cgi-bin/ (RCE).

ServerName localhost

# --- cgi-bin para el PoC de RCE de CVE-2021-41773 ---
ScriptAlias /cgi-bin/ /usr/local/apache2/cgi-bin/
<Directory "/usr/local/apache2/cgi-bin">
    AllowOverride None
    Options +ExecCGI
    Require all granted
</Directory>

# --- Reverse proxy hacia Drupal ---
ProxyRequests Off
ProxyPreserveHost On
# /cgi-bin e /icons se sirven localmente (son los vectores de 41773), no se proxyfican:
ProxyPass /cgi-bin !
ProxyPass /icons !
# Todo lo demas va a Drupal:
ProxyPass        /  http://drupal:80/
ProxyPassReverse /  http://drupal:80/
