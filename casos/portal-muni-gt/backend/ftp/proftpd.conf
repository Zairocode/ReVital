# FTP de actas y transparencia de la muni FICTICIA MuniSoke GT. Configuracion tipica de la epoca:
# FTP sin cifrar, anonimo de lectura, el banner anuncia la version (ServerIdent por defecto).
ServerName            "FTP MuniSoke"
ServerType            standalone
DefaultServer         on
Port                  21
Umask                 022
MaxInstances          30
User                  ftp
Group                 ftp
PassivePorts          30000 30009
UseReverseDNS         off
DefaultRoot           ~
<Anonymous /srv/ftp>
  User                ftp
  Group               ftp
  UserAlias           anonymous ftp
  RequireValidShell   off
  <Limit WRITE>
    DenyAll
  </Limit>
</Anonymous>
