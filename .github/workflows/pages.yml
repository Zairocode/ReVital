# Publica la landing de ReVital (docs/landing/) en GitHub Pages: https://zairocode.github.io/ReVital/
# Solo se publica esa carpeta (no el resto de docs/). Requiere, una vez, en Settings -> Pages: Source = "GitHub Actions".
name: Landing en GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs/landing/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/landing
      - id: despliegue
        uses: actions/deploy-pages@v5
